<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasan // Music</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts & Material Symbols (Material Design 3 için) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            // Material Design 3 Dark Theme Renk Paleti
            m3Bg: '#131316',
            m3Surface: '#1c1b1f',
            m3SurfaceVariant: '#2d2b30',
            m3Primary: '#d0bcff',
            m3OnPrimary: '#381e72',
            m3PrimaryContainer: '#4f378b',
            m3OnPrimaryContainer: '#eaddff',
            m3SecondaryContainer: '#4a4458',
            m3Outline: '#938f99',
            m3OnSurface: '#e6e1e5',
            m3OnSurfaceVariant: '#cac4d0',
          }
        }
      }
    }
  </script>

  <style>
    .m3-transition {
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
    }
    
    /* Canlı Müzik Ekolayzır Animasyonu */
    @keyframes eq-scale {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1); }
    }
    .eq-bar {
      transform-origin: bottom;
      animation: eq-scale 1.2s ease-in-out infinite;
    }
    .eq-1 { animation-delay: 0.1s; }
    .eq-2 { animation-delay: 0.4s; }
    .eq-3 { animation-delay: 0.2s; }
    .eq-4 { animation-delay: 0.6s; }

    /* Önizleme Butonu - 30 Saniyelik İlerleme Çizgisi */
    .preview-btn-wrap {
      position: relative;
      display: inline-flex;
    }
    .preview-ring {
      position: absolute;
      inset: -4px;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      pointer-events: none;
      overflow: visible;
      z-index: 1;
    }
    .preview-ring-shape {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 0;
    }
    .preview-ring-shape.visible {
      opacity: 1;
    }

    /* Geçmiş Dinlemeler - "Sonsuzluk" Efekti
       Listenin altındaki fazladan (5.) şarkı sadece yarısı görünecek şekilde
       kırpılır ve o görünen yarı da alta doğru şeffaflaşarak kaybolur; böylece
       listenin daha aşağı doğru devam ediyormuş hissi (infinite scroll) verilir. */
    .history-fade-viewport {
      position: relative;
      overflow: hidden;
      --history-fade-height: 40px;
      -webkit-mask-image: linear-gradient(to bottom, black calc(100% - var(--history-fade-height)), transparent 100%);
      mask-image: linear-gradient(to bottom, black calc(100% - var(--history-fade-height)), transparent 100%);
    }
  </style>
</head>
<body class="bg-m3Bg text-m3OnSurface font-sans min-h-screen flex flex-col items-center py-12 px-4">

  <!-- Profil Başlığı -->
  <header class="flex flex-col items-center text-center mb-8 max-w-md w-full">
    <!-- Profil Avatar (M3 Squircle tarzı yuvarlatılmış kare) -->
    <div class="w-24 h-24 bg-m3PrimaryContainer rounded-[28px] flex items-center justify-center shadow-md mb-4 overflow-hidden select-none">
      <img src="DSC_0781~2.JPG" alt="Hasan" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">
      <!-- Fotoğraf bulunamazsa yedek olarak görünecek harf -->
      <span class="hidden text-m3OnPrimaryContainer text-4xl font-bold">H</span>
    </div>
    <h1 class="text-3xl font-bold tracking-tight text-m3OnSurface">Hasan</h1>
  </header>

  <!-- ANA İÇERİK ALANI -->
  <main class="max-w-md w-full space-y-6">

    <!-- CANLI / SON ÇALAN KART (M3 Elevated Card) -->
    <section id="now-playing-card" class="bg-m3SurfaceVariant rounded-[28px] p-6 shadow-lg border border-white/5 m3-transition">
      <div class="flex items-center justify-between mb-4">
        <!-- Durum Rozeti -->
        <span id="status-badge" class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-zinc-800 text-zinc-400">
          <span class="w-1.5 h-1.5 rounded-full bg-zinc-400"></span>
          Yükleniyor...
        </span>
        
        <!-- Canlı Ekolayzır -->
        <div id="equalizer" class="hidden flex items-end gap-1 h-5 w-6">
          <div class="w-1 h-full bg-m3Primary rounded-full eq-bar eq-1"></div>
          <div class="w-1 h-full bg-m3Primary rounded-full eq-bar eq-2"></div>
          <div class="w-1 h-full bg-m3Primary rounded-full eq-bar eq-3"></div>
          <div class="w-1 h-full bg-m3Primary rounded-full eq-bar eq-4"></div>
        </div>
      </div>

      <!-- Şarkı Bilgileri -->
      <div class="flex gap-4 items-center">
        <!-- Albüm Kapağı -->
        <div class="relative flex-shrink-0 w-20 h-20 bg-zinc-800 rounded-2xl overflow-hidden shadow-inner">
          <img id="now-playing-img" class="w-full h-full object-cover opacity-0 transition-opacity duration-300" src="" alt="Album Art">
          <!-- Fallback müzik ikonu -->
          <div id="now-playing-fallback" class="absolute inset-0 flex items-center justify-center bg-zinc-800 text-m3Primary">
            <span class="material-symbols-outlined text-4xl">album</span>
          </div>
        </div>
        
        <div class="min-w-0 flex-1">
          <h2 id="now-playing-title" class="font-bold text-lg text-m3OnSurface truncate">...</h2>
          <p id="now-playing-artist" class="text-sm font-medium truncate mt-0.5">...</p>
          <p id="now-playing-album" class="text-xs truncate mt-0.5">...</p>
        </div>
      </div>

      <!-- Önizleme Butonu Yuvası -->
      <div id="main-preview-container" class="mt-4 border-t border-white/10 pt-3 flex justify-end hidden">
        <div class="preview-btn-wrap rounded-full">
          <svg class="preview-ring text-m3Primary">
            <rect id="main-preview-btn-ring" class="preview-ring-shape" x="1" y="1" width="1" height="1" rx="1" ry="1"></rect>
          </svg>
          <button id="main-preview-btn" class="relative flex items-center gap-2 px-4 py-2 bg-m3Primary text-m3OnPrimary rounded-full text-xs font-semibold m3-transition hover:brightness-110 active:brightness-90 focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-m3Primary/60">
            <span class="material-symbols-outlined text-sm">play_arrow</span>
            <span>Önizlemeyi Çal</span>
          </button>
        </div>
      </div>
    </section>

    <!-- SON DİNLEDİĞİM ŞARKILAR LİSTESİ -->
    <section class="bg-m3Surface rounded-[28px] p-6 shadow-md border border-white/5">
      <h3 class="text-xs font-bold tracking-widest text-m3Primary uppercase mb-4">Geçmiş Dinlemeler</h3>
      
      <div id="recent-list-viewport" class="history-fade-viewport">
        <div id="recent-list" class="space-y-4">
          <div class="text-sm text-m3OnSurfaceVariant animate-pulse">Şarkı geçmişi yükleniyor...</div>
        </div>
      </div>
    </section>

    <!-- SOSYAL MEDYA LOGOLARI (M3 Tonal Circle Buttons) -->
    <section class="flex justify-center items-center gap-5 pt-4">
      <!-- Spotify -->
      <a href="https://open.spotify.com/user/31g4uay55kjgceolr3cps3ty4n4u?si=sCQp-tIZShu5ezTRd3WS5w&utm_source=copy-link" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="w-12 h-12 flex items-center justify-center rounded-full bg-m3Surface hover:bg-m3SurfaceVariant border border-white/5 m3-transition shadow-sm hover:scale-105">
        <img src="spotify-white-icon.svg" alt="Spotify" class="w-5 h-5 opacity-90">
      </a>
      
      <!-- YouTube Music -->
      <a href="https://music.youtube.com/@hasanberatkaylan" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="w-12 h-12 flex items-center justify-center rounded-full bg-m3Surface hover:bg-m3SurfaceVariant border border-white/5 m3-transition shadow-sm hover:scale-105">
        <img src="icons8-youtube-music.svg" alt="YouTube Music" class="w-5 h-5 opacity-90">
      </a>

      <!-- Last.fm -->
      <a href="https://www.last.fm/tr/user/hasanbkaylan" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="w-12 h-12 flex items-center justify-center rounded-full bg-m3Surface hover:bg-m3SurfaceVariant border border-white/5 m3-transition shadow-sm hover:scale-105">
        <img src="last-fm-white-icon.svg" alt="Last.fm" class="w-5 h-5 opacity-90">
      </a>
    </section>

  </main>

  <footer class="mt-auto pt-10 text-center">
    <p class="text-[11px] text-m3Outline">Last.fm entegrasyonu ile otomatik olarak güncellenir.</p>
  </footer>

  <script>
    // --- YAPILANDIRMA ---
    const LASTFM_API_KEY = "42256b45c944fd85183c852cf6a1bed9";
    const LASTFM_USERNAME = "hasanbkaylan";
    // --------------------

    const FALLBACK_ART = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='4' fill='%231c1b1f'/><circle cx='12' cy='12' r='8' fill='%232d2b30'/><circle cx='12' cy='12' r='3' fill='%23d0bcff'/></svg>";

    // Global Müzik Çalar Değişkenleri
    let activeAudio = null;
    let activeTrackKey = null; // ŞarkıAdı-Sanatçı eşleşmesi
    const itunesCache = {}; // trackKey -> { previewUrl, artwork } (iTunes'tan çekilen veriler önbelleklenir)

    // Last.fm kapak resmi bulunamadığında / eksik olduğunda iTunes API'sinden
    // yüksek çözünürlüklü kapak resmi ve 30 saniyelik önizleme linkini birlikte çeker
    async function fetchItunesData(title, artist) {
      const trackKey = `${title}-${artist}`;
      if (itunesCache[trackKey]) return itunesCache[trackKey];

      let result = { previewUrl: null, artwork: null };
      try {
        const query = `${title} ${artist}`;
        const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`);
        const data = await response.json();
        if (data.results && data.results.length > 0) {
          const r = data.results[0];
          result.previewUrl = r.previewUrl || null;
          // iTunes varsayılan olarak 100x100 döner, bunu 600x600'e büyütüyoruz
          result.artwork = r.artworkUrl100 ? r.artworkUrl100.replace('100x100bb', '600x600bb') : null;
        }
      } catch (error) {
        console.error("iTunes API Hatası:", error);
      }
      itunesCache[trackKey] = result;
      return result;
    }

    // --- Zor Durumlar İçin Ekstra Kapak Resmi Kaynakları ---
    // Last.fm ve iTunes'ta da bulunamayan kapaklar için son çare olarak denenir.
    // Sırasıyla: Last.fm album.getInfo -> TheAudioDB -> MusicBrainz/Cover Art Archive.
    // (Deezer, proxy'ye bağımlı ve güvenilmez olduğu için; iTunes'un gevşetilmiş
    // arama denemesi de yavaş/tutarsız çalıştığı için zincirden çıkarıldı.)
    // Last.fm'in görsel bulamadığında döndürdüğü bilinen "boş kapak" hash'i; bu hash
    // geçerse görseli yok saymamız gerekir, aksi halde gri bir placeholder gösteririz.
    const LASTFM_BLANK_IMAGE_HASH = "2a96cbd8b46e442fc41c2b86b821562";
    const THEAUDIODB_KEY = "123"; // TheAudioDB'nin herkese açık ücretsiz test anahtarı
    const fallbackArtCache = {}; // trackKey -> url | null

    // 1) Last.fm'in recenttracks uç noktası görsel döndürmese bile, album.getinfo
    // farklı bir kapak barındırıyor olabilir. Aynı API anahtarını yeniden kullanır.
    // iTunes'tan sonra en güvenilir ikinci kaynak olduğu için burada, proxy'ye
    // bağımlı olmayan ve doğrudan CORS destekleyen bir servis olarak öne alındı.
    async function fetchLastfmAlbumArtwork(title, artist, album) {
      try {
        const albumName = album || title;
        const url = `https://ws.audioscrobbler.com/2.0/?method=album.getinfo&api_key=${LASTFM_API_KEY}&artist=${encodeURIComponent(artist)}&album=${encodeURIComponent(albumName)}&format=json`;
        const response = await fetch(url);
        if (!response.ok) return null;
        const data = await response.json();
        const images = data?.album?.image || [];
        for (let i = images.length - 1; i >= 0; i--) {
          const url = images[i]?.['#text'];
          if (url && !url.includes(LASTFM_BLANK_IMAGE_HASH)) return url;
        }
        return null;
      } catch (error) {
        console.error("Last.fm album.getinfo hatası:", error);
        return null;
      }
    }

    // 2) TheAudioDB, geniş bir topluluk kaynaklı müzik/kapak veritabanıdır ve CORS
    // ile herkese açık test anahtarıyla ("123") doğrudan kullanılabilir. Önce albüm
    // adıyla, bulunamazsa şarkı adıyla arar.
    async function fetchAudioDbArtwork(title, artist, album) {
      try {
        if (album) {
          const albumUrl = `https://www.theaudiodb.com/api/v1/json/${THEAUDIODB_KEY}/searchalbum.php?s=${encodeURIComponent(artist)}&a=${encodeURIComponent(album)}`;
          const albumRes = await fetch(albumUrl);
          if (albumRes.ok) {
            const albumData = await albumRes.json();
            const thumb = albumData?.album?.[0]?.strAlbumThumb;
            if (thumb) return thumb;
          }
        }
        const trackUrl = `https://www.theaudiodb.com/api/v1/json/${THEAUDIODB_KEY}/searchtrack.php?s=${encodeURIComponent(artist)}&t=${encodeURIComponent(title)}`;
        const trackRes = await fetch(trackUrl);
        if (trackRes.ok) {
          const trackData = await trackRes.json();
          const track = trackData?.track?.[0];
          const thumb = track?.strTrackThumb || track?.strAlbumThumb;
          if (thumb) return thumb;
        }
        return null;
      } catch (error) {
        console.error("TheAudioDB kapak resmi hatası:", error);
        return null;
      }
    }

    // 3) MusicBrainz üzerinden kaydı bulup bağlı olduğu release'in Cover Art
    // Archive'daki ön kapağını çeker. Her iki servis de doğrudan CORS destekliyor,
    // proxy gerekmiyor.
    async function fetchMusicBrainzArtwork(title, artist) {
      try {
        const mbQuery = `recording:"${title}" AND artist:"${artist}"`;
        const searchUrl = `https://musicbrainz.org/ws/2/recording/?query=${encodeURIComponent(mbQuery)}&fmt=json&limit=1`;
        const searchRes = await fetch(searchUrl);
        if (!searchRes.ok) return null;
        const searchData = await searchRes.json();
        const releaseId = searchData?.recordings?.[0]?.releases?.[0]?.id;
        if (!releaseId) return null;

        const caaRes = await fetch(`https://coverartarchive.org/release/${releaseId}`);
        if (!caaRes.ok) return null;
        const caaData = await caaRes.json();
        const front = caaData?.images?.find(img => img.front) || caaData?.images?.[0];
        return front?.thumbnails?.large || front?.image || null;
      } catch (error) {
        console.error("MusicBrainz/Cover Art Archive hatası:", error);
        return null;
      }
    }

    // Yukarıdaki 4 kaynağı en güvenilirden en zayıfa doğru sırayla dener, ilk
    // bulduğunu döndürür ve önbelleğe alır. Bu fonksiyon SADECE Last.fm (recenttracks)
    // ve iTunes (ilk, sıkı arama) ikisi de kapak bulamadığında çağrılır.
    async function fetchFallbackArtwork(title, artist, album) {
      const trackKey = `${title}-${artist}`;
      if (trackKey in fallbackArtCache) return fallbackArtCache[trackKey];

      let artwork = await fetchLastfmAlbumArtwork(title, artist, album);
      if (!artwork) artwork = await fetchAudioDbArtwork(title, artist, album);
      if (!artwork) artwork = await fetchMusicBrainzArtwork(title, artist);

      fallbackArtCache[trackKey] = artwork;
      return artwork;
    }

    // Bir <img> elementine kapak resmini uygular; Last.fm görseli geçersizse
    // arka planda iTunes'tan görsel çekip günceller. iTunes de bulamazsa (zor
    // durumlar) sırasıyla Last.fm album.getinfo, TheAudioDB ve
    // MusicBrainz/Cover Art Archive denenir.
    function applyCoverArt(imgEl, track, title, artist, sizeIndex) {
      const lastfmUrl = getTrackImage(track, sizeIndex);
      const isLastfmValid = lastfmUrl !== FALLBACK_ART;

      imgEl.src = lastfmUrl;

      if (!isLastfmValid) {
        const album = track?.album?.['#text'] || "";
        fetchItunesData(title, artist).then(res => {
          if (res.artwork) {
            if (imgEl.src !== res.artwork) imgEl.src = res.artwork;
            return;
          }
          // iTunes de bulamadı: sırasıyla Last.fm album.getinfo, TheAudioDB ve
          // MusicBrainz/Cover Art Archive denenir (sadece bu zor durumda)
          fetchFallbackArtwork(title, artist, album).then(url => {
            if (url && imgEl.src !== url) imgEl.src = url;
          });
        });
      }
    }

    // Güvenli görsel çekme fonksiyonu
    function getTrackImage(track, preferredSizeIndex) {
      if (!track || !track.image) return FALLBACK_ART;
      let imageUrl = "";
      if (track.image[preferredSizeIndex] && track.image[preferredSizeIndex]['#text']) {
        imageUrl = track.image[preferredSizeIndex]['#text'];
      }
      if (!imageUrl) {
        for (let i = track.image.length - 1; i >= 0; i--) {
          if (track.image[i] && track.image[i]['#text']) {
            imageUrl = track.image[i]['#text'];
            break;
          }
        }
      }
      if (!imageUrl || imageUrl.trim() === "" || imageUrl.includes(LASTFM_BLANK_IMAGE_HASH)) {
        return FALLBACK_ART;
      }
      return imageUrl;
    }

    async function fetchMusic() {
      const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USERNAME}&api_key=${LASTFM_API_KEY}&format=json&limit=6`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("API hatası");
        const data = await response.json();
        
        const trackList = data.recenttracks?.track;
        if (!trackList || trackList.length === 0) return;

        const tracks = Array.isArray(trackList) ? trackList : [trackList];
        const firstTrack = tracks[0];
        const isCurrentlyPlaying = firstTrack['@attr']?.nowplaying === "true";

        updateNowPlayingCard(firstTrack, isCurrentlyPlaying);

        // Üst karttaki şarkı (canlı ya da son dinlenen fark etmeksizin) zaten
        // en güncel parçayı gösteriyor. Geçmiş listesinin aynı şarkıyı tekrar
        // göstermemesi için her durumda bir sonraki şarkıdan başlıyoruz.
        // 5. şarkı "sonsuzluk" efekti için eklenir: sadece yarısı görünüp
        // alta doğru şeffaflaşacak, listenin devam ettiği hissini verecek.
        updateHistoryList(tracks.slice(1, 1 + 5));

      } catch (error) {
        console.error("Şarkı verileri güncellenemedi:", error);
      }
    }

    function updateNowPlayingCard(track, isLive) {
      const card = document.getElementById('now-playing-card');
      const badge = document.getElementById('status-badge');
      const eq = document.getElementById('equalizer');
      const title = document.getElementById('now-playing-title');
      const artist = document.getElementById('now-playing-artist');
      const album = document.getElementById('now-playing-album');
      const img = document.getElementById('now-playing-img');
      const fallback = document.getElementById('now-playing-fallback');

      const previewContainer = document.getElementById('main-preview-container');
      const previewBtn = document.getElementById('main-preview-btn');

      const tName = track.name || "Bilinmeyen Şarkı";
      const aName = track.artist?.['#text'] || "Bilinmeyen Sanatçı";

      title.innerText = tName;
      artist.innerText = aName;
      album.innerText = track.album?.['#text'] || "";

      img.onload = () => {
        img.classList.remove('opacity-0');
        fallback.classList.add('hidden');
      };
      applyCoverArt(img, track, tName, aName, 2);

      // Önizleme butonunu etkinleştir ve olayları bağla [1]
      previewContainer.classList.remove('hidden');
      requestAnimationFrame(syncMainRingGeometry);
      const safeTitle = tName.replace(/'/g, "\\'");
      const safeArtist = aName.replace(/'/g, "\\'");
      previewBtn.onclick = () => togglePreview(safeTitle, safeArtist, 'main-preview-btn', true);

      // Kart stillerini uygula
      if (isLive) {
        card.className = "bg-m3PrimaryContainer rounded-[28px] p-6 shadow-lg border border-m3Primary/20 m3-transition";
        badge.className = "flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-m3Primary text-m3OnPrimary";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-m3OnPrimary animate-pulse"></span>ŞU AN DİNLİYOR`;
        eq.classList.remove('hidden');
        title.className = "font-bold text-lg text-white truncate";
        artist.className = "text-sm text-[#d0bcff] font-medium truncate mt-0.5";
        album.className = "text-xs text-[#eaddff]/70 truncate mt-0.5";
      } else {
        card.className = "bg-m3SurfaceVariant rounded-[28px] p-6 shadow-lg border border-white/5 m3-transition";
        badge.className = "flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-zinc-800 text-zinc-400";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-zinc-500"></span>SON DİNLENEN`;
        eq.classList.add('hidden');
        title.className = "font-bold text-lg text-m3OnSurface truncate";
        artist.className = "text-sm text-m3Primary font-medium truncate mt-0.5";
        album.className = "text-xs text-m3OnSurfaceVariant truncate mt-0.5";
      }

      // Sayfa yenilendiğinde aktif çalma durumu UI güncellemesi (Her zaman isMainCard = true olarak atanır) [1]
      const trackKey = `${tName}-${aName}`;
      if (activeTrackKey === trackKey && activeAudio && !activeAudio.paused) {
        activeAudio.dataset.elementId = 'main-preview-btn';
        activeAudio.dataset.isMainCard = "true";
        updatePlayButtonUI('main-preview-btn', true, true);
      } else {
        updatePlayButtonUI('main-preview-btn', false, true); // Düzeltildi: isLive yerine her zaman true gönderilerek buton şeklinin bozulması önlendi [1]
      }
    }

    function updateHistoryList(tracks) {
      const container = document.getElementById('recent-list');
      container.innerHTML = ""; 

      tracks.forEach((track, index) => {
        const title = track.name;
        const artist = track.artist?.['#text'];
        const uts = track.date?.uts;
        const timeStr = uts ? timeAgo(uts) : "Az önce";

        const safeTitle = title.replace(/'/g, "\\'");
        const safeArtist = artist.replace(/'/g, "\\'");
        const buttonId = `hist-preview-btn-${index}`;
        const imgId = `hist-img-${index}`;

        const item = document.createElement('div');
        item.className = "flex items-center gap-3 p-2 rounded-2xl hover:bg-white/[0.04] m3-transition";
        item.innerHTML = `
          <img id="${imgId}" class="w-11 h-11 rounded-xl object-cover bg-zinc-800 flex-shrink-0" src="${FALLBACK_ART}" alt="" onerror="this.src='${FALLBACK_ART}'">
          <div class="min-w-0 flex-1">
            <h4 class="font-semibold text-sm text-m3OnSurface truncate">${title}</h4>
            <p class="text-xs text-m3OnSurfaceVariant truncate">${artist}</p>
          </div>
          <div class="flex items-center gap-3 flex-shrink-0">
            <span class="text-[11px] text-m3Outline">${timeStr}</span>
            <div class="preview-btn-wrap rounded-full">
              <svg class="preview-ring text-m3Primary" viewBox="0 0 32 32">
                <circle id="${buttonId}-ring" class="preview-ring-shape" cx="16" cy="16" r="15"></circle>
              </svg>
              <button id="${buttonId}" onclick="togglePreview('${safeTitle}', '${safeArtist}', '${buttonId}', false)" class="relative w-8 h-8 rounded-full flex items-center justify-center bg-m3SurfaceVariant hover:bg-white/[0.08] active:brightness-90 text-m3Primary m3-transition shadow-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-m3Primary/60">
                <span class="material-symbols-outlined text-lg">play_arrow</span>
              </button>
            </div>
          </div>
        `;
        container.appendChild(item);
        applyCoverArt(document.getElementById(imgId), track, title, artist, 1);

        // Sayfa her 20s'de bir güncellendiğinde, bu şarkı çalmaya devam ediyorsa butonun pause ikonunu koru.
        // ÖNEMLİ: container.innerHTML = "" ile liste sıfırdan kurulduğu için buradaki <circle> elemanı da
        // yepyeni (görünmez, dash'siz) bir DOM elemanıdır. Sadece ikonu geri koymak yetmez; halkanın da
        // kaldığı yerden (audio.currentTime'a göre) yeniden bağlanması gerekir, yoksa halka yarım kalmışken
        // aniden kayboluyormuş gibi görünür.
        const trackKey = `${title}-${artist}`;
        if (activeTrackKey === trackKey && activeAudio) {
          activeAudio.dataset.elementId = buttonId;
          activeAudio.dataset.isMainCard = "false";
          const stillPlaying = !activeAudio.paused;
          updatePlayButtonUI(buttonId, stillPlaying, false);
          if (stillPlaying) {
            reattachRing(buttonId, activeAudio);
          } else {
            freezeRing(buttonId, activeAudio);
          }
        }
      });

      adjustHistoryFade();
    }

    // "Sonsuzluk" efekti: viewport'un yüksekliğini, listedeki son öğenin tam
    // yarısında kesecek şekilde piksel bazında hesaplar. Böylece son (5.) şarkı
    // her zaman tam olarak yarısı görünür şekilde kırpılır ve CSS mask ile de
    // o görünen kısım alta doğru şeffaflaşır (bkz. .history-fade-viewport).
    // Öğe sayısı, font yükleme durumu vb. değişse bile hesap her zaman doğru
    // kalır çünkü gerçek render edilmiş boyutlar üzerinden ölçüm yapılır.
    function adjustHistoryFade() {
      const viewport = document.getElementById('recent-list-viewport');
      const list = document.getElementById('recent-list');
      const items = list.children;

      if (items.length < 2) {
        viewport.style.maxHeight = '';
        return;
      }

      const lastItem = items[items.length - 1];
      const listRect = list.getBoundingClientRect();
      const lastRect = lastItem.getBoundingClientRect();
      const halfHeight = lastRect.height / 2;
      const cutHeight = (lastRect.top - listRect.top) + halfHeight;

      viewport.style.maxHeight = `${cutHeight}px`;
      // Fade zonu, sadece son (yarım görünen) öğenin görünen yüksekliği kadar
      // olacak şekilde ayarlanır; böylece üstteki tam görünen 4 şarkı net kalır,
      // sadece 5. şarkının görünen yarısı şeffaflaşarak kaybolur.
      viewport.style.setProperty('--history-fade-height', `${halfHeight}px`);
    }

    // iTunes Dinamik Müzik Önizleme Oynatıcı Motoru [1]
    async function togglePreview(title, artist, elementId, isMainCard) {
      const trackKey = `${title}-${artist}`;
      
      // 1. Aynı şarkıya tekrar tıklandıysa durum değiştir (Duraklat / Oynat)
      if (activeTrackKey === trackKey && activeAudio) {
        if (!activeAudio.paused) {
          activeAudio.pause();
          updatePlayButtonUI(elementId, false, isMainCard);
          freezeRing(elementId, activeAudio);
        } else {
          activeAudio.play();
          updatePlayButtonUI(elementId, true, isMainCard);
          resumeRing(elementId, activeAudio);
        }
        return;
      }

      // 2. Başka bir şarkı çalıyorsa onu durdur ve ikonunu sıfırla
      if (activeAudio) {
        activeAudio.pause();
        const prevElementId = activeAudio.dataset.elementId;
        const prevIsMainCard = activeAudio.dataset.isMainCard === "true";
        updatePlayButtonUI(prevElementId, false, prevIsMainCard);
        resetRing(prevElementId);
      }

      // 3. iTunes API üzerinden önizleme linkini çek (Varsa cache'den al) [1]
      setButtonLoading(elementId, true, isMainCard);
      const itunesData = await fetchItunesData(title, artist);
      const previewUrl = itunesData.previewUrl;
      setButtonLoading(elementId, false, isMainCard);

      // 4. iTunes üzerinde şarkı bulunamadıysa uyarı ver [1]
      if (!previewUrl) {
        alert("Bu parçanın 30 saniyelik önizlemesi veritabanında bulunamadı.");
        return;
      }

      // 5. Şarkıyı oynat [1]
      activeAudio = new Audio(previewUrl);
      activeAudio.dataset.elementId = elementId;
      activeAudio.dataset.isMainCard = isMainCard;
      activeTrackKey = trackKey;

      activeAudio.play();
      updatePlayButtonUI(elementId, true, isMainCard);
      resetRing(elementId);
      startRing(elementId, activeAudio);

      // Şarkı bittiğinde buton durumunu sıfırla [1]
      activeAudio.onended = () => {
        updatePlayButtonUI(elementId, false, isMainCard);
        resetRing(elementId);
        activeAudio = null;
        activeTrackKey = null;
      };
    }

    // --- Ana Buton Halkasının Piksel-Kusursuz Geometri Senkronizasyonu ---
    // Ana buton metne göre genişlik değiştirdiği (Çal / Durdur / Yükleniyor...) için
    // halkanın her zaman butonla birebir örtüşmesi gerekir. Bunu yüzdelik/viewBox
    // gerdirmesiyle değil, gerçek piksel ölçüleriyle çizerek garanti altına alıyoruz.
    function syncMainRingGeometry() {
      const svg = document.querySelector('#main-preview-container .preview-ring');
      const shape = document.getElementById('main-preview-btn-ring');
      if (!svg || !shape) return;
      const w = svg.clientWidth;
      const h = svg.clientHeight;
      if (!w || !h) return; // buton henüz gizliyse (0 boyut) ölçüm yapma

      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

      const inset = 1.5; // stroke'un kenarda kırpılmasını önlemek için
      const rw = Math.max(w - inset * 2, 0);
      const rh = Math.max(h - inset * 2, 0);

      shape.setAttribute('x', inset);
      shape.setAttribute('y', inset);
      shape.setAttribute('width', rw);
      shape.setAttribute('height', rh);
      shape.setAttribute('rx', rh / 2);
      shape.setAttribute('ry', rh / 2);
    }

    // Buton her boyut değiştirdiğinde (metin/ikon değişimi, yeniden boyutlanma,
    // gizlenip gösterilme) halkayı otomatik olarak yeniden hizala.
    const mainRingResizeObserver = new ResizeObserver(() => syncMainRingGeometry());
    document.addEventListener('DOMContentLoaded', () => {
      const wrap = document.querySelector('#main-preview-container .preview-btn-wrap');
      if (wrap) mainRingResizeObserver.observe(wrap);
      syncMainRingGeometry();
    });
    window.addEventListener('resize', syncMainRingGeometry);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(syncMainRingGeometry);
    }

    // --- 30 Saniyelik Önizleme İlerleme Çizgisi Kontrolleri ---

    function getRingShape(elementId) {
      return document.getElementById(`${elementId}-ring`);
    }

    // Şeklin GERÇEK çevre uzunluğunu tarayıcıdan doğrudan okur ve dash düzenini
    // buna göre kurar. pathLength özniteliğine güvenmiyoruz çünkü path-olmayan
    // (rect/circle) şekillerde tarayıcılar arası tutarsız davranıp halkanın
    // kaymasına/aniden kaybolmasına sebep oluyordu.
    function prepareRingDash(shape) {
      const length = shape.getTotalLength();
      shape.style.strokeDasharray = String(length);
      return length;
    }

    // Çalma başladığında halkayı sıfırdan, parçanın süresi kadar sürede tamamlanacak şekilde başlatır
    function startRing(elementId, audio) {
      if (elementId === 'main-preview-btn') syncMainRingGeometry();
      const shape = getRingShape(elementId);
      if (!shape) return;
      const duration = (audio.duration && isFinite(audio.duration)) ? audio.duration : 30;
      const length = prepareRingDash(shape);
      shape.classList.add('visible');
      shape.style.transition = 'none';
      shape.style.strokeDashoffset = String(length);
      // Reflow zorlayarak transition'ın anında sıfırlanmasını sağlıyoruz
      void shape.getBoundingClientRect();
      requestAnimationFrame(() => {
        shape.style.transition = `stroke-dashoffset ${duration}s linear`;
        shape.style.strokeDashoffset = '0';
      });
    }

    // Duraklatıldığında halkayı o anki konumunda dondurur
    function freezeRing(elementId, audio) {
      const shape = getRingShape(elementId);
      if (!shape) return;
      const duration = (audio.duration && isFinite(audio.duration)) ? audio.duration : 30;
      const ratio = Math.min(audio.currentTime / duration, 1);
      const length = prepareRingDash(shape);
      shape.classList.add('visible');
      shape.style.transition = 'none';
      shape.style.strokeDashoffset = String(length * (1 - ratio));
      void shape.getBoundingClientRect();
    }

    // Geçmiş listesi periyodik olarak (20s) baştan çizildiğinde, hâlâ çalmakta olan
    // parçanın halka elemanı da sıfırdan (görünmez, dash tanımsız) yaratılmış olur.
    // Bu fonksiyon audio.currentTime'a bakarak halkayı doğru orandan itibaren
    // görünür hale getirir ve kalan süre kadar normal akışına devam ettirir; böylece
    // halka yarısına gelmeden aniden kaybolma sorunu ortadan kalkar.
    function reattachRing(elementId, audio) {
      const shape = getRingShape(elementId);
      if (!shape) return;
      const duration = (audio.duration && isFinite(audio.duration)) ? audio.duration : 30;
      const ratio = Math.min(audio.currentTime / duration, 1);
      const remaining = Math.max(duration - audio.currentTime, 0);
      const length = prepareRingDash(shape);
      shape.classList.add('visible');
      shape.style.transition = 'none';
      shape.style.strokeDashoffset = String(length * (1 - ratio));
      // Reflow zorlayarak transition'ın anında sıfırlanmasını sağlıyoruz
      void shape.getBoundingClientRect();
      requestAnimationFrame(() => {
        shape.style.transition = `stroke-dashoffset ${remaining}s linear`;
        shape.style.strokeDashoffset = '0';
      });
    }

    // Tekrar oynatıldığında kalan süre kadar halkayı devam ettirir
    function resumeRing(elementId, audio) {
      const shape = getRingShape(elementId);
      if (!shape) return;
      const duration = (audio.duration && isFinite(audio.duration)) ? audio.duration : 30;
      const remaining = Math.max(duration - audio.currentTime, 0);
      requestAnimationFrame(() => {
        shape.style.transition = `stroke-dashoffset ${remaining}s linear`;
        shape.style.strokeDashoffset = '0';
      });
    }

    // Halkayı görünmez ve başlangıç konumuna resetler
    function resetRing(elementId) {
      if (elementId === 'main-preview-btn') syncMainRingGeometry();
      const shape = getRingShape(elementId);
      if (!shape) return;
      const length = prepareRingDash(shape);
      shape.style.transition = 'none';
      shape.style.strokeDashoffset = String(length);
      shape.classList.remove('visible');
    }


    // Butonların Tasarım/Durum Güncellemeleri (M3 Uyumlu)
    function updatePlayButtonUI(elementId, isPlaying, isMainCard) {
      const btn = document.getElementById(elementId);
      if (!btn) return;
      
      const icon = btn.querySelector('.material-symbols-outlined');
      
      if (isMainCard) {
        const text = btn.querySelector('span:not(.material-symbols-outlined)');
        if (isPlaying) {
          icon.innerText = "pause";
          text.innerText = "Önizlemeyi Durdur";
          btn.className = "relative flex items-center gap-2 px-4 py-2 bg-m3PrimaryContainer text-m3OnPrimaryContainer rounded-full text-xs font-semibold m3-transition hover:brightness-110 active:brightness-90 focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-m3Primary/60";
        } else {
          icon.innerText = "play_arrow";
          text.innerText = "Önizlemeyi Çal";
          btn.className = "relative flex items-center gap-2 px-4 py-2 bg-m3Primary text-m3OnPrimary rounded-full text-xs font-semibold m3-transition hover:brightness-110 active:brightness-90 focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-m3Primary/60";
        }
      } else {
        if (isPlaying) {
          icon.innerText = "pause";
          btn.className = "relative w-8 h-8 rounded-full flex items-center justify-center bg-m3PrimaryContainer text-m3OnPrimaryContainer m3-transition shadow-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-m3Primary/60";
        } else {
          icon.innerText = "play_arrow";
          btn.className = "relative w-8 h-8 rounded-full flex items-center justify-center bg-m3SurfaceVariant hover:bg-white/[0.08] active:brightness-90 text-m3Primary m3-transition shadow-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-m3Primary/60";
        }
      }
    }

    // Buton Yükleniyor Animasyonu
    function setButtonLoading(elementId, isLoading, isMainCard) {
      const btn = document.getElementById(elementId);
      if (!btn) return;
      
      const icon = btn.querySelector('.material-symbols-outlined');
      
      if (isMainCard) {
        const text = btn.querySelector('span:not(.material-symbols-outlined)');
        if (isLoading) {
          btn.disabled = true;
          icon.innerText = "sync";
          icon.classList.add("animate-spin");
          text.innerText = "Yükleniyor...";
        } else {
          btn.disabled = false;
          icon.classList.remove("animate-spin");
        }
      } else {
        if (isLoading) {
          btn.disabled = true;
          icon.innerText = "sync";
          icon.classList.add("animate-spin");
        } else {
          btn.disabled = false;
          icon.classList.remove("animate-spin");
        }
      }
    }

    function timeAgo(uts) {
      const now = Math.floor(Date.now() / 1000);
      const diff = now - parseInt(uts, 10);
      if (diff < 60) return 'Az önce';
      const mins = Math.floor(diff / 60);
      if (mins < 60) return `${mins} dk`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours} sa`;
      const days = Math.floor(hours / 24);
      return `${days} gün`;
    }

    // İlk yükleme ve periyodik sorgulama (20 saniyede bir)
    fetchMusic();
    setInterval(fetchMusic, 20000);

    // Pencere boyutu değişirse (ör. döndürme, klavye açılması) son şarkının
    // yarım görünme hesaplaması da yeniden yapılır.
    let historyFadeResizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(historyFadeResizeTimeout);
      historyFadeResizeTimeout = setTimeout(adjustHistoryFade, 150);
    });
  </script>
</body>
</html>
